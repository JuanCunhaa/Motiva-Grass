      "description": "## Objetivo\n\nEstabelecer critérios mensuráveis para dados, ML, API, experiência e operação.\n\n## Pré-condições\n\nKAN-21 e KAN-22.\n\n## Escopo\n\n* Fórmulas e unidades de classificação, altura, segmentação, rejeição e API.\n* Metas provisórias de baseline, POC e MVP.\n* Tamanho mínimo de amostra e reporte por classe/fatia.\n* Separação entre validação, teste congelado e aceitação.\n* Processo formal de revisão de metas.\n* Itens fora do escopo.\n\n## Entregáveis\n\nTabela de métricas, metas e gates por fase.\n\n## Testes e evidências\n\nValidar fórmulas com exemplos e garantir que o test set não participa de tuning.\n\n## Critérios de aceite\n\nO projeto consegue emitir GO, GO WITH LIMITATIONS ou NO-GO sem depender de opinião subjetiva.\n\n## Riscos\n\nMetas irreais, médias globais que escondem classes fracas ou thresholds escolhidos depois do teste.\n\n## Gate humano\n\nAprovação de produto recomendada para metas finais.\n\n## Modelo recomendado\n\nGPT-5.6 Thinking.\n\n## Prompt de execução\n\nLeia KAN-1, KAN-3, KAN-21 e KAN-22. Defina métricas e gates honestos, com amostra e fatias explícitas. Registre a versão e mencione KAN-23.\n\n## Regra documental\n\nPublicar a matriz de aceitação no Confluence quando disponível e manter histórico de revisões.\n\n<!-- MOTIVA-SKILLS:INÍCIO -->\n## Skills recomendadas para execução\n\n- Perfil: release\n- Orquestradora: motiva-ticket-orchestrator\n- Próprias obrigatórias: motiva-ticket-orchestrator, motiva-jira-ticket-executor, motiva-release-manager, motiva-quality-gate, motiva-documentation-maintainer\n- Públicas obrigatórias: quality-playbook, security-review\n- Condicionais e condições: screen-recording — evidência visual for exigida e a captura puder ser sanitizada; differential-review — existir diff implementado para revisão focada; agentic-eval — houver artefato de agente com critérios avaliáveis\n- Ordem: motiva-jira-ticket-executor → motiva-ticket-orchestrator → motiva-release-manager → motiva-quality-gate → motiva-documentation-maintainer → quality-playbook → security-review\n- Evidências: Checklist de candidate, checksums, SBOM/Cards e rollback.; Decisão GO/NO-GO e aprovações do artefato exato.\n- Gates humanos: nenhum gate específico identificado\n- Restrições específicas: Não publicar, taguear, mesclar ou alterar produção sem gate humano.\n- Confiança: HIGH\n- Referência central: config/skills/jira-skill-routing.yaml\n- Atualizado em: 2026-08-05T12:00:00-03:00\n<!-- MOTIVA-SKILLS:FIM -->"
