      "description": "## Objetivo\n\nPadronizar a descrição, execução, revisão e evidência dos trabalhos.\n\n## Pré-condições\n\nKAN-18 concluída.\n\n## Escopo\n\n* Criar templates para tarefa, história, bug, pesquisa e decisão.\n* Criar template de PR com escopo, testes, evidências, riscos, rollback e chave Jira.\n* Criar template de relatório técnico.\n* Evitar duplicação integral das regras globais de KAN-1.\n\n## Fora do escopo\n\nLabels, milestones, workflow e automações do Jira.\n\n## Entregáveis\n\nTemplates válidos e exemplos renderizados.\n\n## Testes e evidências\n\nValidar Markdown/YAML, campos obrigatórios e renderização.\n\n## Critérios de aceite\n\nTodo novo trabalho pode ser descrito e auditado com os templates.\n\n## Riscos\n\nTemplates longos demais ou campos ambíguos.\n\n## Gate humano\n\nNão previsto.\n\n## Modelo recomendado\n\nGPT-5.6 Thinking para desenho; GPT-5.6 Sol Alto para implementação.\n\n## Prompt de execução\n\nLeia KAN-1, KAN-2 e KAN-18. Implemente somente os templates, valide sua renderização e abra PR mencionando KAN-19.\n\n## Regra documental\n\nRegistrar a versão dos templates e decisões no Confluence; enquanto indisponível, comentar no Jira.\n\n<!-- MOTIVA-SKILLS:INÍCIO -->\n## Skills recomendadas para execução\n\n- Perfil: documentation\n- Orquestradora: motiva-ticket-orchestrator\n- Próprias obrigatórias: motiva-ticket-orchestrator, motiva-jira-ticket-executor, motiva-documentation-maintainer\n- Públicas obrigatórias: create-specification, make-repo-contribution\n- Condicionais e condições: agentic-eval — houver artefato de agente com critérios avaliáveis\n- Ordem: motiva-jira-ticket-executor → motiva-ticket-orchestrator → motiva-documentation-maintainer → create-specification → make-repo-contribution\n- Evidências: Documento canônico atualizado, indexado e sem regra duplicada.; Lint de Markdown/links e revisão do owner aplicável.\n- Gates humanos: nenhum gate específico identificado\n- Restrições específicas: Preservar escopo e campos do ticket; não executar ações protegidas sem gate aplicável.\n- Confiança: HIGH\n- Referência central: config/skills/jira-skill-routing.yaml\n- Atualizado em: 2026-08-05T12:00:00-03:00\n<!-- MOTIVA-SKILLS:FIM -->"
