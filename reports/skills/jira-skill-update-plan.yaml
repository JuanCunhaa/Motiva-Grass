      "reason": "replace-or-add-idempotent-MOTIVA-SKILLS-block",
      "description": "## Objetivo\n\nConcluir as configurações administrativas do projeto KAN e habilitar a documentação oficial no Confluence.\n\n## Situação atual validada\n\n### Concluído pela integração\n\n* O projeto KAN, do tipo software/Kanban e gerenciado pela equipe, foi usado como quadro oficial.\n* KAN-1 foi criada como roadmap mestre.\n* KAN-2 a KAN-17 foram criados como 16 Épicos.\n* KAN-18 a KAN-156 foram criados como 139 tickets executáveis.\n* Todos os tickets executáveis possuem pai correto, descrição, prioridade por label, área/fase, modelo recomendado e regra documental.\n* Tipos disponíveis e validados: Epic, História, Feature, Tarefa, Bug e Subtask.\n* Workflow real: `Tarefas pendentes → Em andamento → Em análise → Concluído`.\n* Dependências críticas usam links `Blocks`; referências auxiliares permanecem na descrição.\n* Gates reais usam `gate-human`; impedimentos ativos usam `Flagged = Impediment`.\n\n### Bloqueio atual\n\nO Confluence não está instalado/provisionado para esta instância. A tentativa de acesso retornou `403 Forbidden — The app is not installed on this instance`. A integração possui apenas `read:jira-work` e `write:jira-work`.\n\n## Configuração administrativa recomendada na interface\n\n### Projeto e quadro\n\n1. Renomear o projeto de **Meu espaço Kanban** para **Motiva-Grass**.\n2. Manter a chave `KAN` para não quebrar as 156 referências já criadas.\n3. Manter o workflow enxuto de quatro estados. Não é necessário criar uma coluna exclusiva de bloqueio; usar Flagged e labels evita estados redundantes.\n4. Configurar limite de WIP em `Em andamento` e `Em análise` de acordo com a capacidade real da equipe.\n5. Exibir nos cards: chave, tipo, prioridade, Épico/pai, responsável e labels.\n6. Ativar backlog e painel de Épicos, quando disponíveis no projeto.\n\n### Views e filtros sugeridos\n\n* **Roadmap:** `project = KAN AND issuetype = Feature ORDER BY created ASC`\n* **Épicos:** `project = KAN AND issuetype = Epic ORDER BY key ASC`\n* **Backlog executável:** `project = KAN AND issuetype in (10003,10004) AND statusCategory != Done ORDER BY Rank ASC`\n* **Prioridade P0:** `project = KAN AND labels = priority-p0 AND statusCategory != Done ORDER BY Rank ASC`\n* **Gates humanos:** `project = KAN AND labels = gate-human AND statusCategory != Done ORDER BY key ASC`\n* **Impedimentos ativos:** `project = KAN AND Flagged = Impediment AND statusCategory != Done ORDER BY key ASC`\n* **GPT-5.6 Thinking:** `project = KAN AND labels = model-gpt-5-6-thinking AND statusCategory != Done ORDER BY Rank ASC`\n* **GPT-5.6 Sol Alto:** `project = KAN AND labels = model-gpt-5-6-sol-alto AND statusCategory != Done ORDER BY Rank ASC`\n* **Documentação pendente:** `project = KAN AND labels = docs-confluence-required AND statusCategory != Done ORDER BY key ASC`\n* **Bugs abertos:** `project = KAN AND issuetype = Bug AND statusCategory != Done ORDER BY priority DESC, created ASC`\n\n### Uso dos tipos\n\n* **Epic:** macroárea do MVP.\n* **História:** comportamento percebido pelo usuário.\n* **Tarefa:** trabalho técnico, pesquisa, dados, segurança, operação ou validação.\n* **Bug:** defeito real com reprodução e teste de regressão.\n* **Subtask:** divisão pequena de ticket já iniciado.\n* **Feature:** agregador excepcional; KAN-1 é o roadmap mestre.\n\n## Provisionamento do Confluence\n\n1. Adicionar o produto **Confluence** ao site `gp16-motiva.atlassian.net`.\n2. Criar o espaço **Motiva-Grass**, chave sugerida `MGRASS`.\n3. Instalar/autorizar a integração Atlassian Rovo também para o Confluence.\n4. Garantir escopos de leitura e escrita de páginas/espaços.\n5. Validar criação e atualização de uma página de teste pela integração.\n6. Remover o impedimento deste ticket somente depois do teste real.\n\n## Hierarquia documental obrigatória\n\n* **Motiva-Grass — Home**\n\n    * Roadmap e visão do produto\n    * Governança, DoR, DoD e templates\n    * Produto, requisitos e UX\n    * Pesquisa e decisões de adoção\n    * Arquitetura e ADRs\n    * Dados, protocolos e Data Cards\n    * Visão computacional e geometria\n    * ML, experimentos e Model Cards\n    * API e contratos\n    * Frontend e design system\n    * Segurança, privacidade e compliance\n    * DevSecOps, MLOps e operação\n    * QA, evidências e release\n    * 16 páginas raiz, uma por Épico\n    \n\n## Regra por ticket\n\nCada ticket concluído deverá criar ou atualizar uma página de execução sob seu Épico contendo:\n\n* objetivo e resumo da entrega;\n* decisões e alternativas descartadas;\n* arquivos, artefatos e versões;\n* testes, métricas e evidências;\n* riscos e limitações;\n* links de PR, commits e release;\n* resultado final: concluído, parcial, bloqueado ou NO-GO.\n\n## Automação recomendada\n\n* Ao adicionar `gate-human` e marcar Flagged, comentar o motivo e o desbloqueio esperado.\n* Ao mover para `Em análise`, exigir link de PR/evidência.\n* Ao mover para `Concluído`, exigir documentação e critérios de aceite verificados.\n* Ao criar Bug, exigir resultado observado, esperado, reprodução, ambiente e severidade.\n* Ao concluir uma dependência crítica, notificar os tickets bloqueados relacionados.\n\n## Entregáveis\n\nProjeto renomeado, card layout revisado, views/filtros salvos, Confluence provisionado, hierarquia documental criada e integração de leitura/escrita validada.\n\n## Testes\n\n* Validar visualmente os tipos, pais, labels e cards.\n* Executar os JQLs sugeridos.\n* Criar e atualizar uma página de teste no Confluence.\n* Confirmar que um ticket `gate-human` pode ser localizado e marcado como impedimento.\n\n## Critérios de aceite\n\nO backlog pode ser administrado sem planilha externa e a documentação possui uma fonte oficial acessível pela integração.\n\n## Riscos\n\nRenomear a chave do projeto, criar status redundantes, manter dois backlogs concorrentes ou considerar o Confluence integrado sem teste real.\n\n## Gate humano\n\nObrigatório. Renomeação do projeto, card layout, views/automação e provisionamento do Confluence dependem de ação administrativa na interface.\n\n## Modelo recomendado\n\nGPT-5.6 Thinking para auditoria e configuração; GPT-5.6 Sol Alto para automações suportadas.\n\n## Prompt\n\nLeia KAN-1, KAN-2 e KAN-20. Aplique automaticamente tudo que a integração permitir. Para configurações administrativas indisponíveis, mantenha este ticket marcado como impedimento, registre passos exatos e só conclua após evidência real. Mencione KAN-89.\n\n## Documentação\n\nEnquanto o Confluence estiver indisponível, KAN-1, KAN-20 e KAN-89 são a fonte oficial temporária.\n\n<!-- MOTIVA-SKILLS:INÍCIO -->\n## Skills recomendadas para execução\n\n- Perfil: governance\n- Orquestradora: motiva-ticket-orchestrator\n- Próprias obrigatórias: motiva-ticket-orchestrator, motiva-jira-ticket-executor, motiva-work-selector, motiva-documentation-maintainer\n- Públicas obrigatórias: make-repo-contribution, create-specification\n- Condicionais e condições: agentic-eval — houver artefato de agente com critérios avaliáveis\n- Ordem: motiva-jira-ticket-executor → motiva-ticket-orchestrator → motiva-work-selector → motiva-documentation-maintainer → make-repo-contribution → create-specification\n- Evidências: Documento/configuração revisável com referências Jira e critérios preservados.; Validação de estrutura, links e idempotência registrada.\n- Gates humanos: Gate humano descrito em KAN-89: satisfazer e registrar antes da ação protegida.\n- Restrições específicas: Preservar escopo e campos do ticket; não executar ações protegidas sem gate aplicável.\n- Confiança: HIGH\n- Referência central: config/skills/jira-skill-routing.yaml\n- Atualizado em: 2026-08-05T12:00:00-03:00\n<!-- MOTIVA-SKILLS:FIM -->"
