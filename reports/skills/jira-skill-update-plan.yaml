      "description": "## Objetivo\n\nTransformar requisitos aprovados em um contrato preliminar verificável para web, API e ML.\n\n## Dependências\n\nKAN-21 e KAN-22.\n\n## Escopo\n\n* Entrada de imagem, limites e modos disponíveis.\n* Saída de espécie, probabilidades, média, P50, P90, intervalo, qualidade, warnings e versão.\n* Códigos de erro e estados conclusivo, inconclusivo e inválido.\n* Matriz requisito → campo → teste.\n* Versionamento do schema sem implementar a API.\n\n## Entregáveis\n\nJSON Schema preliminar, contrato de resultado e matriz de rastreabilidade.\n\n## Testes\n\nValidar exemplos válidos/inválidos e campos opcionais.\n\n## Critérios de aceite\n\nCampos ausentes não viram zero; mudanças breaking exigem nova versão.\n\n## Riscos\n\nPrometer medida ou classe quando sinais forem insuficientes.\n\n## Modelo recomendado\n\nGPT-5.6 Thinking.\n\n## Prompt\n\nLeia KAN-1, KAN-3, KAN-21 e KAN-22. Especifique contrato substituível e seguro, sem acoplar ao modelo final. Mencione KAN-90.\n\n## Documentação\n\nPublicar o contrato versionado no Confluence quando disponível.\n\n<!-- MOTIVA-SKILLS:INÍCIO -->\n## Skills recomendadas para execução\n\n- Perfil: contracts\n- Orquestradora: motiva-ticket-orchestrator\n- Próprias obrigatórias: motiva-ticket-orchestrator, motiva-jira-ticket-executor, motiva-repository-context, motiva-inference-contract, motiva-quality-gate, motiva-documentation-maintainer\n- Públicas obrigatórias: create-specification, property-based-testing\n- Condicionais e condições: dimensional-analysis — o ticket manipular unidades ou conversões; security-review — a mudança criar ou alterar uma fronteira de confiança\n- Ordem: motiva-jira-ticket-executor → motiva-ticket-orchestrator → motiva-repository-context → motiva-inference-contract → motiva-quality-gate → motiva-documentation-maintainer → create-specification → property-based-testing\n- Evidências: Schemas e exemplos válidos/inválidos com testes de compatibilidade.; Consumidores afetados ve