      "description": "## Objetivo\n\nConfirmar latência, throughput, startup e recursos da solução candidata em condições representativas.\n\n## Dependências\n\nKAN-127 e KAN-143.\n\n## Escopo\n\n* P50/P95 ponta a ponta.\n* CPU/GPU, memória e startup.\n* Concorrência e throughput.\n* Limites e alertas.\n* Comparação dos modos disponíveis.\n\n## Entregáveis\n\nRelatório de desempenho e capacidade com ambiente registrado.\n\n## Testes\n\nRepetições, cold/warm start e cenários de concorrência definidos.\n\n## Critérios de aceite\n\nAs metas de KAN-23 são cumpridas ou a release é bloqueada/limitada explicitamente.\n\n## Riscos\n\nNúmeros sem contexto de hardware ou carga.\n\n## Modelo recomendado\n\nGPT-5.6 Thinking para auditoria; GPT-5.6 Sol Alto para execução.\n\n## Prompt\n\nLeia KAN-1, KAN-17 e dependências. Execute os cenários aprovados sem alterar o produto para favorecer resultados. Mencione KAN-87.\n\n## Documentação\n\nPublicar metodologia, ambiente e resultados no Confluence quando disponível.\n\n<!-- MOTIVA-SKILLS:INÍCIO -->\n## Skills recomendadas para execução\n\n- Perfil: infrastructure\n- Orquestradora: motiva-ticket-orchestrator\n- Próprias obrigatórias: motiva-ticket-orchestrator, motiva-jira-ticket-executor, motiva-repository-context, motiva-architecture-guard, motiva-quality-gate, motiva-documentation-maintainer\n- Públicas obrigatórias: security-review, supply-chain-risk-auditor\n- Condicionais e condições: insecure-defaults — o ticket definir ou revisar defaults de segurança; agentic-actions-auditor — o workflow GitHub Actions executar agentes com entrada não confiável ou secrets\n- Ordem: motiva-jira-ticket-executor → motiva-ticket-orchestrator → motiva-repository-context → motiva-architecture-guard → motiva-quality-gate → motiva-documentation-maintainer → security-review → supply-chain-risk-auditor\n- Evidências: Validate/plan/policy/smoke em ambiente autorizado, sem secrets.; Configuração, custo, rollback e limites operacionais registrados.\n- Gates humanos: nenhum gate específico identificado\n- Restrições específicas: Preservar escopo e campos do ticket; não executar ações protegidas sem gate aplicável.\n- Confiança: HIGH\n- Referência central: config/skills/jira-skill-routing.yaml\n- Atualizado em: 2026-08-05T12:00:00-03:00\n<!-- MOTIVA-SKILLS:FIM -->"
