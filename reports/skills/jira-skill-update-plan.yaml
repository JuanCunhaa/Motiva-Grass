      "reason": "replace-or-add-idempotent-MOTIVA-SKILLS-block",
      "description": "## Objetivo\n\nConsolidar evidências e fechar lacunas documentais antes da release candidate.\n\n## Dependências\n\nKAN-69, KAN-85, KAN-86, KAN-87 e KAN-145 a KAN-150.\n\n## Escopo\n\n* Conferir requisitos, métricas e relatórios.\n* Conferir manuais, troubleshooting e limitações.\n* Conferir Model Cards, Data Cards, notices e SBOM.\n* Conferir artefatos, checksums e rollback.\n* Emitir checklist de prontidão sem publicar.\n\n## Entregáveis\n\nRelatório de validação do MVP e checklist rastreável.\n\n## Testes\n\nRelacionar cada requisito a uma evidência e verificar links/versões.\n\n## Critérios de aceite\n\nToda lacuna possui Bug, tarefa ou bloqueio; a release ainda não é publicada nesta etapa.\n\n## Riscos\n\nDocumentação divergente do artefato candidato.\n\n## Gate humano\n\nAceitação de lacunas materiais não é permitida nesta tarefa.\n\n## Modelo recomendado\n\nGPT-5.6 Thinking como auditor e release manager.\n\n## Prompt\n\nLeia KAN-1, KAN-17 e todas as dependências. Audite a rastreabilidade sem emitir GO nem publicar release. Mencione KAN-88.\n\n## Documentação\n\nO relatório final deve ser publicado no Confluence quando disponível e referenciado no Jira.\n\n<!-- MOTIVA-SKILLS:INÍCIO -->\n## Skills recomendadas para execução\n\n- Perfil: release\n- Orquestradora: motiva-ticket-orchestrator\n- Próprias obrigatórias: motiva-ticket-orchestrator, motiva-jira-ticket-executor, motiva-release-manager, motiva-quality-gate, motiva-documentation-maintainer\n- Públicas obrigatórias: quality-playbook, security-review\n- Condicionais e condições: screen-recording — evidência visual for exigida e a captura puder ser sanitizada; differential-review — existir diff implementado para revisão focada; agentic-eval — houver artefato de agente com critérios avaliáveis\n- Ordem: motiva-jira-ticket-executor → motiva-ticket-orchestrator → motiva-release-manager → motiva-quality-gate → motiva-documentation-maintainer → quality-playbook → security-review\n- Evidências: Checklist de candidate, checksums, SBOM/Cards e rollback.; Decisão GO/NO-GO e aprovações do artefato exato.\n- Gates humanos: nenhum gate específico identificado\n- Restrições específicas: Não publicar, taguear, mesclar ou alterar produção sem gate humano.\n- Confiança: HIGH\n- Referência central: config/skills/jira-skill-routing.yaml\n- Atualizado em: 2026-08-05T12:00:00-03:00\n<!-- MOTIVA-SKILLS:FIM -->"
