      "description": "## Objetivo final\n\nEntregar um MVP integrado que receba uma fotografia de gramado, valide a captura, identifique o tipo provável entre classes suportadas e estime a altura com confiança, intervalo, warnings e resultado inconclusivo quando necessário.\n\n## Estrutura validada\n\n* **KAN-1:** roadmap mestre.\n* **KAN-2 a KAN-17:** 16 Épicos.\n* **KAN-18 a KAN-156:** 139 tarefas executáveis.\n* **Total:** 156 itens, sem lacunas na sequência criada.\n* Todas as tarefas executáveis possuem Épico pai, descrição e labels.\n\n## Tipos de item\n\n* **Epic:** macroárea do MVP.\n* **História:** capacidade percebida diretamente pelo usuário.\n* **Tarefa:** pesquisa, arquitetura, implementação técnica, dados, segurança, operação ou validação.\n* **Bug:** defeito real encontrado durante execução ou QA.\n* **Subtask:** parte pequena de uma tarefa já iniciada, sem mudar seu objetivo.\n* **Feature:** agregador excepcional; KAN-1 é o roadmap mestre.\n\n## Workflow real disponível\n\nO projeto atualmente possui:\n\n1. Tarefas pendentes.\n2. Em andamento.\n3. Em análise.\n4. Concluído.\n\nKAN-89 concentra o ajuste administrativo recomendado para adicionar `Pronto` e `Aguardando ação humana/Bloqueado`, renomear o quadro e configurar views. Enquanto isso, itens bloqueados usam `Flagged = Impediment` e a label `gate-human`.\n\n## Ordem oficial\n\n### 0. Governança e bootstrap\n\nKAN-18, KAN-19, KAN-89, KAN-20, KAN-35 e KAN-84.\n\n### 1. Produto e contratos\n\nKAN-21, KAN-22, KAN-90 e KAN-23.\n\n### 2. Pesquisa e compliance\n\nKAN-24, KAN-91, KAN-25, KAN-92, KAN-93, KAN-26, KAN-94 e KAN-27.\n\n### 3. Arquitetura\n\nKAN-28, KAN-29, KAN-95, KAN-30, KAN-96, KAN-31, KAN-97 e KAN-98.\n\n### 4. Fundação técnica\n\nKAN-32 a KAN-35.\n\n### 5. Preparação e coleta de campo\n\nKAN-36, KAN-37, KAN-99, KAN-38, KAN-100, KAN-39, KAN-44, KAN-106, KAN-40, KAN-101, KAN-102, KAN-153 e KAN-154.\n\n### 6. Engenharia e aprovação dos dados\n\nKAN-41, KAN-103, KAN-104, KAN-42, KAN-105, KAN-43, KAN-45, KAN-107 e KAN-155.\n\n### 7. Geometria\n\nKAN-46, KAN-47, KAN-48, KAN-108 e KAN-49.\n\n### Gate antes dos treinos\n\nKAN-66 deve congelar o test set antes de KAN-50 a KAN-65.\n\n### 8. Baselines\n\nKAN-50, KAN-109, KAN-110, KAN-51, KAN-111, KAN-52, KAN-53, KAN-112 e KAN-54.\n\n### 9. Modelo multitarefa\n\nKAN-55, KAN-56, KAN-57, KAN-113, KAN-58, KAN-114, KAN-59, KAN-115, KAN-60, KAN-116 e KAN-61.\n\n### 10. MoGe-2 opcional\n\nKAN-62, KAN-63, KAN-117, KAN-64, KAN-118, KAN-119 e KAN-65.\n\n### 11. Validação e seleção de ML\n\nKAN-67, KAN-120, KAN-121, KAN-68, KAN-122 e KAN-69.\n\n### 12. API\n\nKAN-70, KAN-71, KAN-72, KAN-123, KAN-124, KAN-73, KAN-125, KAN-126, KAN-74 e KAN-127.\n\n### 13. Interface web\n\nKAN-75, KAN-128, KAN-76, KAN-129, KAN-77, KAN-130, KAN-78, KAN-131, KAN-79, KAN-132 e KAN-133.\n\n### 14. DevSecOps, MLOps e operação\n\nKAN-80, KAN-134, KAN-135, KAN-81, KAN-136, KAN-137, KAN-138, KAN-82, KAN-139, KAN-140, KAN-83, KAN-141, KAN-142, KAN-143, KAN-144 e KAN-156.\n\n### 15. QA e release\n\nKAN-85, KAN-145, KAN-146, KAN-86, KAN-147, KAN-148, KAN-87, KAN-149, KAN-150, KAN-88, KAN-151 e KAN-152.\n\n## Gates obrigatórios\n\n* Confluence, workflow e configurações administrativas: KAN-89.\n* Impressão e medição do marcador: KAN-99.\n* Coletas físicas: KAN-101 e KAN-154.\n* Quotas/classes da coleta completa: KAN-153.\n* Licença ambígua: KAN-27, KAN-91 e KAN-103.\n* Recursos pagos e produção: KAN-97, KAN-98, KAN-106, KAN-135, KAN-141 e KAN-142.\n* Promoção do modelo: KAN-140.\n* Publicação final: KAN-151 e KAN-152.\n\n## Modelos recomendados\n\n* **GPT-5.6 Thinking:** produto, pesquisa, arquitetura, segurança, desenho experimental, auditoria, documentação e decisões.\n* **GPT-5.6 Sol Alto:** implementação extensa, engenharia de dados, treinamento, backend, frontend, CI/CD e infraestrutura.\n* O modelo indicado na label e na descrição de cada ticket é o executor principal; tarefas híbridas usam Thinking para planejamento/revisão e Sol Alto para implementação.\n\n## Fluxo obrigatório por tarefa\n\n1. Ler KAN-1, o Épico pai, o ticket atual, dependências e documentação integrada.\n2. Confirmar Definition of Ready.\n3. Criar branch exclusiva no padrão `tipo/KAN-N-descricao`.\n4. Implementar somente o escopo.\n5. Executar testes e coletar evidências reais.\n6. Atualizar a documentação oficial.\n7. Abrir PR mencionando a chave Jira.\n8. Não fazer merge com checks falhando.\n9. Mover para Em análise e somente depois Concluído.\n\n## Regras críticas\n\n* Não inventar dados, medições, métricas, testes ou evidências.\n* Não armazenar datasets, pesos, imagens privadas ou secrets no Git.\n* Não usar o test set para treino, seleção de features, thresholds ou hiperparâmetros.\n* Não tratar profundidade monocular como verdade métrica.\n* Preferir resultado inconclusivo a uma previsão fabricada.\n* Código, pesos e dados possuem auditorias de licença separadas.\n* Bugs reais devem ser criados como `Bug`, com resultado esperado, resultado observado, passos, ambiente e evidência.\n\n## Documentação e Confluence\n\nO Jira é a fonte documental temporária. O teste de leitura e escrita do Confluence retornou `403 Forbidden — The app is not installed on this instance`. KAN-89 está marcada como impedimento e contém o passo a passo para provisionar o Confluence, instalar a integração e criar a hierarquia documental.\n\n## Encerramento\n\nKAN-1 só pode ser concluída após KAN-152 emitir GO ou GO WITH LIMITATIONS, publicar exatamente a release candidate validada e não existir risco ou Bug crítico aberto.\n\n<!-- MOTIVA-SKILLS:INÍCIO -->\n## Skills recomendadas para execução\n\n- Perfil: governance\n- Orquestradora: motiva-ticket-orchestrator\n- Próprias obrigatórias: motiva-ticket-orchestrator, motiva-jira-ticket-executor, motiva-work-selector, motiva-documentation-maintainer\n- Públicas obrigatórias: make-repo-contribution, create-specification\n- Condicionais e condições: agentic-eval — houver artefato de agente com critérios avaliávei