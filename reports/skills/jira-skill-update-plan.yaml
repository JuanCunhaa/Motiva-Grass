      "reason": "replace-or-add-idempotent-MOTIVA-SKILLS-block",
      "description": "## Objetivo\n\nCriar o commit-base mínimo de um repositório vazio e estabelecer a estrutura documental inicial.\n\n## Pré-condições\n\nNenhuma. Esta é a primeira tarefa executável.\n\n## Escopo\n\n* Confirmar se o repositório está vazio.\n* Quando necessário, criar na `main` somente um README mínimo para permitir a primeira branch.\n* Criar branch exclusiva e completar README, `.gitignore`, `.editorconfig` e `docs/`.\n* Registrar que a exceção de commit direto é única.\n* Não definir licença antes da auditoria de compliance.\n\n## Fora do escopo\n\nCódigo de produto, CI completa e definição da licença.\n\n## Entregáveis\n\nEstrutura inicial, README honesto e registro da exceção de bootstrap.\n\n## Testes e evidências\n\nValidar Markdown, links, árvore final e ausência de segredos/binários.\n\n## Critérios de aceite\n\nSomente o bootstrap mínimo foi direto na `main`; todo o restante entrou por branch e PR.\n\n## Riscos\n\nCriar conteúdo demais no commit-base ou declarar uma licença prematuramente.\n\n## Gate humano\n\nNão previsto.\n\n## Modelo recomendado\n\nGPT-5.6 Sol Alto; revisão GPT-5.6 Thinking.\n\n## Prompt de execução\n\nLeia KAN-1, KAN-2 e este ticket. Resolva apenas o caso do repositório vazio, crie branch exclusiva para o restante, teste os arquivos e abra PR mencionando KAN-18. Não invente evidências nem adicione código funcional.\n\n## Regra documental\n\nRegistrar decisões, arquivos criados, testes e PR na página do Épico no Confluence; enquanto indisponível, usar comentário final no Jira.\n\n<!-- MOTIVA-SKILLS:INÍCIO -->\n## Skills recomendadas para execução\n\n- Perfil: documentation\n- Orquestradora: motiva-ticket-orchestrator\n- Próprias obrigatórias: motiva-ticket-orchestrator, motiva-jira-ticket-executor, motiva-documentation-maintainer\n- Públicas obrigatórias: create-specification, make-repo-contribution\n- Condicionais e condições: agentic-eval — houver artefato de agente com critérios avaliáveis\n- Ordem: motiva-jira-ticket-executor → motiva-ticket-orchestrator → motiva-documentation-maintainer → create-specification → make-repo-contribution\n- Evidências: Documento canônico atualizado, indexado e sem regra duplicada.; Lint de Markdown/links e revisão do owner aplicável.\n- Gates humanos: nenhum gate específico identificado\n- Restrições específicas: Preservar escopo e campos do ticket; não executar ações protegidas sem gate aplicável.\n- Confiança: HIGH\n- Referência central: config/skills/jira-skill-routing.yaml\n- Atualizado em: 2026-08-05T12:00:00-03:00\n<!-- MOTIVA-SKILLS:FIM -->"
