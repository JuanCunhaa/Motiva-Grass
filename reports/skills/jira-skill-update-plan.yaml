      "key": "KAN-20",
      "old_description_sha256": "bd67fa87739e14450e9b234ac276abf62af8b7eb16d8c53f90c1e2e6d6091365",
      "new_description_sha256": "321be35188f37a1fc21912c9fb4503868253bb8578dcd5d4d9436fbe55f4a542",
      "changed": true,
      "reason": "replace-or-add-idempotent-MOTIVA-SKILLS-block",
      "description": "## Objetivo\n\nDefinir quando um ticket pode começar, como deve ser executado, quais informações são obrigatórias e quando pode ser declarado concluído.\n\n## Dependências\n\nKAN-18, KAN-19 e KAN-89.\n\n## Estrutura obrigatória para novos tickets executáveis\n\n1. **Objetivo:** resultado único e verificável.\n2. **Contexto/resultado esperado:** por que a tarefa existe.\n3. **Dependências:** chaves Jira que realmente impedem ou orientam a execução.\n4. **Escopo:** entregas incluídas.\n5. **Fora do escopo:** limites relevantes; quando omitido, vale tudo que não estiver no escopo nem em ticket irmão.\n6. **Entregáveis:** código, documentos, artefatos ou decisões esperadas.\n7. **Testes e evidências:** validações reais obrigatórias.\n8. **Critérios de aceite:** condições objetivas para conclusão.\n9. **Riscos e limitações:** falhas previsíveis, privacidade, custo e dívida.\n10. **Gate humano:** obrigatório apenas quando existir decisão ou ação humana real.\n11. **Modelo recomendado:** GPT-5.6 Thinking, GPT-5.6 Sol Alto ou fluxo híbrido.\n12. **Prompt de execução:** leitura obrigatória, escopo, restrições e chave Jira.\n13. **Documentação:** página/área do Confluence que deverá ser criada ou atualizada.\n\n## Política de gate humano\n\n* Tickets que realmente dependem de aprovação, coleta física, licença, custo, acesso administrativo ou publicação recebem a label `gate-human` e uma seção explícita `Gate humano`.\n* A ausência da label `gate-human` significa **Gate humano: não aplicável**. Não é necessário repetir essa frase em todos os tickets.\n* `Flagged = Impediment` só deve ser aplicado quando o gate estiver bloqueando o trabalho naquele momento, não apenas por existir no futuro.\n* O agente pode tomar decisões reversíveis dentro do escopo; não deve pedir confirmação desnecessária.\n\n## Política de dependências\n\n* A descrição lista todas as pré-condições e referências necessárias.\n* O link Jira `Blocks` é obrigatório para dependências de caminho crítico, gates e ordem que não pode ser invertida.\n* Dependências auxiliares podem permanecer textuais para evitar um grafo excessivamente denso.\n* Um ticket bloqueado não pode avançar para `Em andamento` sem registrar a razão e o próximo desbloqueio.\n\n## Uso dos tipos\n\n* **Epic:** macroárea do MVP; não gera branch própria.\n* **História:** capacidade percebida diretamente pelo usuário.\n* **Tarefa:** pesquisa, arquitetura, implementação técnica, dados, segurança, operação ou validação.\n* **Bug:** defeito real observado durante implementação ou QA.\n* **Subtask:** parte pequena de um ticket iniciado, sem alterar o objetivo principal.\n* **Feature:** agregador excepcional; KAN-1 é o roadmap mestre.\n\n## Estrutura obrigatória de Bug\n\n* Resultado observado.\n* Resultado esperado.\n* Passos mínimos de reprodução.\n* Ambiente, versão e configuração.\n* Evidências e impacto.\n* Severidade/prioridade.\n* Hipótese inicial sem afirmar causa não comprovada.\n* Teste de regressão obrigatório.\n* Ticket/PR que introduziu ou encontrou o defeito, quando conhecido.\n\n## Definition of Ready\n\nUm ticket está pronto quando:\n\n* possui pai, tipo, prioridade, área/fase e modelo recomendados;\n* objetivo, escopo, aceite e testes são claros;\n* dependências bloqueadoras estão concluídas ou formalmente dispensadas;\n* dados, acessos e decisões necessários estão disponíveis;\n* gate humano pendente está identificado e, se ativo, marcado como impedimento;\n* não existe duplicata ou conflito de responsabilidade com outro ticket.\n\n## Definition of Done\n\nUm ticket só está concluído quando:\n\n* escopo implementado sem entregas ocultas;\n* testes aplicáveis executados e evidenciados;\n* critérios de aceite verificados um a um;\n* PR menciona a chave Jira e checks obrigatórios estão aprovados;\n* documentação oficial foi criada/atualizada;\n* riscos, limitações e decisões foram registrados;\n* Bugs encontrados foram corrigidos ou abertos separadamente;\n* nenhum dado, métrica, medição ou evidência foi inventado.\n\n## Modelos recomendados\n\n* **GPT-5.6 Thinking:** produto, pesquisa, arquitetura, segurança, desenho experimental, auditoria, validação e documentação.\n* **GPT-5.6 Sol Alto:** implementação extensa, engenharia de dados, ML, backend, frontend, CI/CD e infraestrutura.\n* **Híbrido:** Thinking para planejar/revisar e Sol Alto para implementar; a descrição define o executor principal.\n\n## Workflow real\n\n`Tarefas pendentes → Em andamento → Em análise → Concluído`.\n\nBloqueios usam `Flagged = Impediment` e labels específicas; o projeto não possui status separado de bloqueado.\n\n## Regra documental\n\nO Confluence será a fonte oficial quando provisionado. Cada execução deverá registrar resumo, decisões, arquivos/artefatos, testes, métricas, limitações, riscos e links de PR. Enquanto KAN-89 estiver bloqueada, a descrição e os comentários do Jira são a fonte temporária.\n\n## Testes e evidências desta tarefa\n\n* Validar tickets prontos, bloqueados, parciais, com NO-GO e com Bug.\n* Auditar que todos os tickets executáveis possuem pai, descrição, prioridade, modelo e documentação.\n* Confirmar que todos os tickets `gate-human` possuem seção explícita.\n\n## Critérios de aceite\n\nNenhum agente pode declarar sucesso sem evidência verificável e nenhum ticket precisa de intervenção humana quando a decisão é reversível e está dentro do escopo.\n\n## Riscos\n\nProcesso burocrático, gates excessivos, tickets vagos e conclusão sem documentação.\n\n## Gate humano\n\nNão aplicável à definição desta política.\n\n## Prompt de execução\n\nLeia KAN-1, KAN-2, KAN-18, KAN-19 e KAN-89. Aplique estas regras a uma tarefa por vez. Não amplie o escopo, não invente evidências e abra Bug separado quando encontrar defeito fora do objetivo atual. Mencione KAN-20.\n\n## Documentação\n\nPublicar DoR, DoD, modelo de ticket, modelo de Bug e contrato do agente no Confluence quando disponível; até lá, este ticket é a referência normativa.\n\n<!-- MOTIVA-SKILLS:INÍCIO -->\n## Skills recomendadas para execução\n\n- Perfil: contracts\n- Orquestradora: motiva-ticket-orchestrator\n- Próprias obrigatórias: motiva-ticket-orchestrator, motiva-jira-ticket-executor, motiva-repository-context, motiva-inference-contract, motiva-quality-gate, motiva-documentation-maintainer\n- Públicas obrigatórias: create-specification, property-based-testing\n- Condicionais e condições: dimensional-analysis — o ticket manipular unidades ou conversões; security-review — a mudança criar ou alterar uma fronteira de confiança\n- Ordem: motiva-jira-ticket-executor → motiva-ticket-orchestrator → motiva-repository-context → motiva-inference-contract → motiva-quality-gate → motiva-documentation-maintainer → create-specification → property-based-testing\n- Evidências: Schemas e exemplos válidos/inválidos com testes de compatibilidade.; Consumidores afetados verificados na mesma versão.\n- Gates humanos: nenhum gate específico identificado\n- Restrições específicas: Preservar escopo e campos do ticket; não executar ações protegidas sem gate aplicável.\n- Confiança: HIGH\n- Referência central: config/skills/jira-skill-routing.yaml\n- Atualizado em: 2026-08-05T12:00:00-03:00\n<!-- MOTIVA-SKILLS:FIM -->"
